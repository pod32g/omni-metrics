services:
  omni-metrics:
    build:
      context: .
      args:
        VERSION: ${VERSION:-0.1.0-m1}
    image: omni-metrics:local
    container_name: omni-metrics
    restart: unless-stopped
    # Listen on all interfaces inside the container; the host port mapping
    # controls external exposure. CLI flags override the config's listen/storage,
    # so external reachability is guaranteed regardless of the config file.
    # The config file defines the scrape jobs (self + omni-identity).
    command: ["-config", "/etc/omni/omni.yml", "-listen", "0.0.0.0:9090", "-storage", "/data"]
    environment:
      # Optional: tee logs to omnilog. Off unless LOGSHIP_ENABLED=true. The API
      # key is a secret → host .env (gitignored), never committed.
      LOGSHIP_ENABLED: ${LOGSHIP_ENABLED:-false}
      LOGSHIP_URL: ${LOGSHIP_URL:-}
      LOGSHIP_API_KEY: ${LOGSHIP_API_KEY:-}
      LOGSHIP_SERVICE: ${LOGSHIP_SERVICE:-omni-metrics}
      # omni-identity /metrics bearer token (secret → host env / CI secret),
      # referenced as ${OMNI_IDENTITY_TOKEN} by the omni-identity scrape job.
      OMNI_IDENTITY_TOKEN: ${OMNI_IDENTITY_TOKEN:-}
      # omni-notify API bearer token (secret → host .env / CI secret), referenced
      # as ${OMNI_NOTIFY_TOKEN} by the alerting.notify block. Required when notify
      # is enabled: a no-default ${VAR} that resolves empty fails config load.
      OMNI_NOTIFY_TOKEN: ${OMNI_NOTIFY_TOKEN:-}
    # Fronted by the netviz-sidecar (below): expose internally instead of
    # publishing. The sidecar takes over host port 9090.
    expose:
      - "9090"
    volumes:
      - omni-metrics-data:/data
      - ./omni.yml:/etc/omni/omni.yml:ro
    healthcheck:
      # Distroless has no shell/curl, so the binary self-probes.
      test: ["CMD", "/omni", "healthcheck", "-url", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # --- Omni-NetViz observability sidecar ---
  # Fronts omni-metrics' published port (9090) and reverse-proxies to the app on
  # the internal network, reporting inbound traffic metadata to Omni-NetViz.
  # Metadata only — never bodies or credentials; talks only to Omni-NetViz.
  # Requires the netviz-sidecar:local image on the deploy host (built from
  # github.com/pod32g/omni-netviz Dockerfile.sidecar).
  netviz-sidecar:
    image: netviz-sidecar:local
    container_name: omni-metrics-netviz
    restart: unless-stopped
    depends_on:
      - omni-metrics
    command:
      - "-service=omni-metrics"
      - "-host=chizu"
      - "-namespace=omni-metrics"
      - "-environment=prod"
      - "-docker-network=omni-metrics_default"
      - "-listen=:9090"
      - "-upstream=http://omni-metrics:9090"
      - "-flush-interval=10s"
    environment:
      NETVIZ_URL: "${NETVIZ_URL:-http://192.168.68.34:8099}"
      NETVIZ_TOKEN: "${NETVIZ_INGEST_TOKEN:-}"
    ports:
      - "9090:9090"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  omni-metrics-data:
    name: omni-metrics-data
