# omni-metrics runtime configuration.
# The deploy runs: omni -config /etc/omni/omni.yml -listen 0.0.0.0:9090 -storage /data
# CLI flags override web.listen / storage.path; scrape jobs are defined here.
global:
  scrape_interval: 15s
  scrape_timeout: 10s

storage:
  path: /data
  retention: 24h

web:
  listen: 0.0.0.0:9090

scrape_configs:
  # omni-metrics' own /metrics.
  - job_name: omni-metrics
    static_configs:
      - targets: [127.0.0.1:9090]

  # omni-identity — a separate compose project, reached via the host's published
  # port (8081 -> container 8080). Its /metrics requires a bearer token; the
  # value comes from the OMNI_IDENTITY_TOKEN env (CI secret / host env), never
  # committed. Same-host hop, so plain http is acceptable here.
  - job_name: omni-identity
    authorization:
      credentials: ${OMNI_IDENTITY_TOKEN}
    static_configs:
      - targets: [192.168.68.34:8081]

  # omni-bugtracker — another compose project on this host (8092 -> container 8080).
  # Its /metrics needs no credentials: it exposes only HTTP request counters and
  # latency histograms, no issue content, and the endpoint was already reachable on
  # the LAN before this job existed. Same-host hop, so plain http is fine.
  - job_name: omni-bugtracker
    static_configs:
      - targets: [192.168.68.34:8092]

  # omni-gateway - the forward proxy on this host (9091 -> container 9090). Its
  # admin listener carries /-/reload, which can replace the running policy, so
  # it is bearer-protected; the gateway refuses to start on a non-loopback bind
  # without a token. The value comes from OMNI_GATEWAY_ADMIN_TOKEN (host .env /
  # CI secret), never committed. Same-host hop, so plain http is fine.
  - job_name: omni-gateway
    authorization:
      credentials: ${OMNI_GATEWAY_ADMIN_TOKEN}
    static_configs:
      - targets: [192.168.68.34:9091]

  # omni-artifactory - the artifact service's control plane (/metrics, incl.
  # the Pulp health it exports) and zot's native registry metrics, which the app
  # relays at /metrics/zot. The app joins omni-metrics_default, so the target is
  # its container name; it is in NO_PROXY above, so the scrape is direct (no
  # NetViz sidecar). Bearer from OMNI_ARTIFACTORY_METRICS_TOKEN (host .env),
  # never committed.
  - job_name: omni-artifactory
    authorization:
      credentials: ${OMNI_ARTIFACTORY_METRICS_TOKEN}
    static_configs:
      - targets: [omni-artifactory:9102]
  - job_name: omni-artifactory-zot
    authorization:
      credentials: ${OMNI_ARTIFACTORY_METRICS_TOKEN}
    static_configs:
      - targets: [http://omni-artifactory:9102/metrics/zot]

  # omni-media - the episode tracker (pod32g/omni-media). It joins
  # omni-metrics_default, so the target is its container name; it is in
  # NO_PROXY below, so the scrape is direct (no NetViz sidecar). Bearer from
  # OMNI_MEDIA_METRICS_TOKEN (host .env), never committed.
  - job_name: omni-media
    authorization:
      credentials: ${OMNI_MEDIA_METRICS_TOKEN}
    static_configs:
      - targets: [omni-media:9102]

# Alerting: the engine runs with defaults (builtin "local" datasource). Forward
# firing/resolved transitions to omni-notify — a separate compose project reached
# via the host's published port (8088 -> container 8080). The bearer token comes
# from OMNI_NOTIFY_TOKEN (host env / CI secret), never committed. Same-host hop,
# so plain http is acceptable.
alerting:
  notify:
    enabled: true
    url: http://192.168.68.34:8088
    token: ${OMNI_NOTIFY_TOKEN}
